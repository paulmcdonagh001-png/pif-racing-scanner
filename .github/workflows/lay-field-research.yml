name: PIF Racing historical lay-field research
on:
  push:
    branches: [research/lay-field-two-point-zero]
    paths:
      - '.github/workflows/lay-field-research.yml'
      - 'research/lay_field_profile_scan.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research-only historical price-touch study
        run: python -u research/lay_field_profile_scan.py
