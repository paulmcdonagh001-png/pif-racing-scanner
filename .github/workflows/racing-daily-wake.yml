name: PIF Racing prospective data wake
on:
  schedule:
    - cron: "7 6-21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pif-racing-wakeup
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake private data service (no credentials sent)
        run: |
          curl --fail --silent --show-error --location --max-time 190 \
            --retry 3 --retry-delay 15 \
            https://pif-racing-paper.onrender.com/health > /dev/null
