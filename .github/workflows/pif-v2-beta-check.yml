name: PIF Racing V2 beta page checks
on:
  push:
    branches: [main, pif-v2-independent-beta-20261026]
    paths:
      - 'v2.html'
      - 'research/test_v2_evidence_card.cjs'
      - 'research/test_v2_market_card.cjs'
      - 'research/test_v2_day_retry.cjs'
      - '.github/workflows/pif-v2-beta-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2.html'
      - 'research/test_v2_evidence_card.cjs'
      - 'research/test_v2_market_card.cjs'
      - 'research/test_v2_day_retry.cjs'
jobs:
  isolated-beta-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent page and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          doc = Path('v2.html').read_text()
          start = doc.find('<script>')
          end = doc.find('</script>', start)
          assert start >= 0 and end > start, 'Expected one embedded script'
          source = doc[start+len('<script>'):end]
          Path('/tmp/pif_v2_beta_script.js').write_text(source)
          for fragment in (
              'v2-races', 'session_token', 'function row(h,raceType,race){',
              'Research order #', 'conditions_supported', 'display_all_type_results',
              'unratedReason()', 'function bar(label,description){',
              'class="evidence-factor', 'course_distance_badges',
          ):
              assert fragment in source, 'Missing scanner feature: ' + fragment
          assert 'id="toggle-races"' in doc
          assert 'Collapse all races' in doc and 'Show race' in doc
          PY
          node --check /tmp/pif_v2_beta_script.js
      - name: Verify missing-evidence cards and shortlist safety
        run: node research/test_v2_evidence_card.cjs
      - name: Verify market comparison maths
        run: node research/test_v2_market_card.cjs
      - name: Verify day switch and connection recovery
        run: node research/test_v2_day_retry.cjs
