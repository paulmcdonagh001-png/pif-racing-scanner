name: PIF Racing Research Tests
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test free-data collector
        run: python -m unittest discover -s research -p 'test_*.py' -v
