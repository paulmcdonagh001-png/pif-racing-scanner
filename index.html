<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1827"><meta name="description" content="PIF Racing Scanner — private race analysis and paper tracking"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>PIF Racing Scanner</title>
<style>
:root{color-scheme:dark;--bg:#091522;--surface:#102438;--surface2:#152d42;--line:#294357;--ink:#f3f7fa;--muted:#a3b7c6;--mint:#80e0bb;--amber:#ffd289;--red:#ffa5a2}*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 65% 0,#183851 0,var(--bg) 56%);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--mint)}.shell{max-width:980px;margin:0 auto;padding:0 14px 85px}.top{position:sticky;top:0;z-index:6;background:rgba(9,21,34,.96);backdrop-filter:blur(14px);margin:0 -14px;padding:15px 14px 8px;border-bottom:1px solid #213a50}.brand{display:flex;gap:10px;align-items:center}.brandmark{width:41px;height:41px;background:linear-gradient(130deg,#80e0bb,#2f957a);color:#083027;border-radius:11px;display:grid;place-items:center;font-size:21px;font-weight:950}.brand h1{font-size:17px;letter-spacing:.04em;margin:0}.tiny{font-size:11px;color:var(--muted)}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{border:1px solid #30634f;color:var(--mint);background:#123c35;border-radius:25px;padding:5px 9px;font-size:11px;font-weight:700}.nav{display:flex;gap:7px;margin-top:15px}.nav button{flex:1;border:none;background:none;color:var(--muted);padding:10px 6px;border-bottom:2px solid transparent;font-weight:700;font-size:13px}.nav button.active{color:var(--mint);border-bottom-color:var(--mint)}.card{background:rgba(16,36,56,.93);border:1px solid #284358;border-radius:16px;padding:15px;margin-top:14px}.intro{display:flex;align-items:start;justify-content:space-between;gap:12px}.intro h2{font-size:21px;margin:0 0 7px}.small{font-size:12px;color:var(--muted);line-height:1.5}.muted{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid #42647c;border-radius:10px;background:#20394e;color:var(--ink);padding:10px 13px;font-weight:700;font-size:13px}.btn.primary{background:var(--mint);color:#0b3027;border-color:var(--mint)}.btn.ghost{background:transparent}.btn.danger{border-color:#744548;color:var(--red);background:transparent}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}.race-strip{display:flex;gap:7px;overflow-x:auto;padding:12px 0 3px;scrollbar-width:thin}.race-chip{flex:0 0 auto;background:#132c40;border:1px solid #2d475b;border-radius:11px;padding:10px 12px;color:var(--ink);text-align:left;min-width:95px}.race-chip.active{border-color:var(--mint);background:#174039}.race-chip .time{font-weight:850;font-size:17px}.race-chip small{display:block;color:var(--muted);font-size:11px}.race-head{margin-top:15px}.race-head h2{font-size:20px;margin:0 0 4px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 5px;gap:10px}.section-title h3{margin:0;font-size:15px}.runner{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px}.runner + .runner{margin-top:8px}.rname{font-size:16px;font-weight:780}.rmeta{font-size:12px;color:var(--muted);margin-top:4px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.stat{background:#1b3446;border:1px solid #2b4759;border-radius:7px;padding:3px 6px;font-size:11px;color:#d8e6f0}.score{font-size:22px;font-weight:850;text-align:right}.score.na{font-size:19px;color:var(--muted)}.rate{font-size:10px;text-align:right;color:var(--muted);max-width:116px}.coverage{font-size:10px;text-align:right;color:var(--muted);margin-top:5px}.tip{border-left:3px solid var(--mint);padding:10px 12px;color:#d1e5de;background:#17392f;border-radius:0 10px 10px 0;font-size:12px;margin-top:12px}.alert{border-left-color:var(--amber);background:#3a3023;color:#f5e2bf}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{color:#c4d7e2;font-size:12px;font-weight:700}.field input,.field select,.field textarea{background:#0b1e2d;color:var(--ink);border:1px solid #38566a;padding:10px;border-radius:9px;width:100%;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.overlay{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:end;justify-content:center}.sheet{background:#102537;border:1px solid #335267;border-radius:20px 20px 0 0;max-height:94dvh;overflow:auto;width:100%;max-width:700px;padding:17px 18px calc(22px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 4px;font-size:20px}.fieldrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.fieldrow select{background:#102d3f;color:white;border:1px solid #466478;border-radius:9px;padding:9px 6px;min-width:118px;max-width:45%}.fieldrow .desc{font-size:11px;color:var(--muted);margin-top:3px}.close{border:1px solid #3a566b;background:transparent;color:white;border-radius:10px;padding:5px 10px}.divider{height:1px;background:var(--line);margin:16px 0}.journal{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:8px 0}.metric{font-size:23px;font-weight:900}.footer-note{color:#8ca2b5;font-size:11px;margin:24px 3px;line-height:1.5}.right{text-align:right}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;color:var(--amber)}.fine{font-size:11px;color:var(--muted);margin-top:4px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.status-win{color:var(--mint)}.status-loss{color:var(--red)}@media(min-width:720px){.top{padding:20px 14px 8px}.shell{padding-bottom:35px}.top{margin:0 -14px}.races-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.races-grid .runner{margin-top:8px}.sheet{border-radius:18px;align-self:center;max-height:92dvh}.intro h2{font-size:24px}}
</style></head><body><div class="shell"><header class="top"><div class="headrow"><div class="brand"><div class="brandmark">P</div><div><h1>PIF RACING</h1><div class="tiny">PRIVATE LIVE SCANNER · V0.8</div></div></div><span class="pill">EXPERIMENTAL</span></div><nav class="nav"><button id="nav-races" onclick="switchView('races')">Race Scanner</button><button id="nav-journal" onclick="switchView('journal')">Paper Tracker</button><button id="nav-research" onclick="location.href='race-research.html'">Research</button><button id="nav-settings" onclick="switchView('settings')">Data & Setup</button></nav></header><main id="app"></main><div class="footer-note">Private research tool. Standard racecards, recent trainer form and indicative market prices are available. Manual Power Ratings are separate and are not winning probabilities; there is no demonstrated betting edge.</div></div><div id="modal"></div><script>
'use strict';
const FACTORS=[{key:'ground',label:'Going suitability',detail:'Verified runs on comparable going',weight:15},{key:'distance',label:'Distance / stamina',detail:'Proven at trip and under similar conditions',weight:15},{key:'form',label:'Recent performance',detail:'Quality of previous runs, not form figures alone',weight:15},{key:'handicap',label:'Class / handicap mark',detail:'Ratings, weight and suitable level',weight:15},{key:'course',label:'Course and conditions',detail:'Track, jumping / draw, pace suitability',weight:10},{key:'fitness',label:'Fitness and changes',detail:'Layoff, equipment and recent runs',weight:10},{key:'connections',label:'Trainer / jockey',detail:'Verified relevant evidence, not reputation',weight:5},{key:'opposition',label:'Strength vs opposition',detail:'Evidence relative to each rival',weight:15}];
const KEY='pif-racing-scanner-data-v01';
const demoTables=[
{time:'14:20',title:'Class 4 Handicap Hurdle',distance:'3m 1½f',going:'Good to Firm',type:'Hurdle',runners:[['Jackstell',7,117,170,'1-5-6-P-1',38,'Jamie Snowden','Isabelle Ryder (5)'],["I'm A Starman",13,109,162,'4-5-2-P-2',18,'Mark Rimell','Sam Twiston-Davies'],['No More Bolero',7,107,160,'1-1-2-3-1',8,'James Owen','Jonathan Burke'],["Betty's Tiara",8,103,156,'7-9-8-1-5',28,'Ben Pauling','Callum Pritchard']]},
{time:'15:30',title:'Class 4 Handicap Hurdle',distance:'2m 3½f',going:'Good to Firm',type:'Hurdle',runners:[['Krak',6,120,168,'2-4-3-2-2',35,'Dan Skelton','Charlie Todd'],['Donnie Azoff',10,118,166,'5-2-1-2-2',47,'Jamie Snowden','Isabelle Ryder (5)'],['Sixty Plus',6,115,163,'1-6-9-6-P',26,'James Owen','Jonathan Burke'],['Jaramillo',8,113,161,'6-5-6-8-3',38,'Warren Greatrex','Richard Upton (10)'],['Whinney Hill',6,112,160,'4-P-P-5-0',18,'Dave Roberts','Lee Edwards'],['Son of Hypnos',9,102,150,'7-7-4-1-6',25,'Ryan Chapman','Jack Stenhouse (7)'],['Department of War',11,100,148,'9-3-0-P-0',764,'Katy Price','Shane Quinlan (3)'],['Devon Red',7,96,144,'4-2-4-2-9-4',10,'Nick Scholfield','Harry Reed']]},
{time:'16:05',title:'Class 5 Mares Handicap Hurdle',distance:'2m 3½f',going:'Good to Firm',type:'Hurdle',runners:[['Mahon Falls',5,100,168,'2-3-3-7-3',149,'Katy Price','Shane Quinlan (3)'],['Miracles Do Happen',5,97,165,'1-8-P-8-1',21,'Billy Aprahamian','Sam Twiston-Davies'],['Siorai',4,96,162,'2-2-6-4-2',23,'Harry Derham',"Paul O'Brien"],['Lady Dapple Rose',5,91,159,'8-3-5-F-9',28,'Ben Pauling','Beau Morgan (5)'],['Zaraquelle',4,91,157,'4-2',77,'James Owen','Jonathan Burke'],['Barafundle Bay',5,77,145,'4-7-8-0-4',21,'Christian Williams','Adam Wedge'],['Yanka Blue',5,77,145,'2-2-7-P-4-4',17,'Barry Murphy','Callum Pritchard']]}];
let state;let view='races';let currentRaceId=null;
function newId(){return 'id_'+Math.random().toString(36).slice(2,10)}
function initial(){return {version:1,races:demoTables.map((r)=>({id:newId(),date:'2026-10-13',course:'Hereford',time:r.time,title:r.title,going:r.going,type:r.type,distance:r.distance,source:'ARCHIVED EXAMPLE · Claude free racecard supplied by user, 13 Oct 2026',runners:r.runners.map(a=>({id:newId(),name:a[0],age:a[1],or:a[2],weight:a[3],form:a[4],days:a[5],trainer:a[6],jockey:a[7],odds:'',factors:{},notes:''}))})),journal:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.races)&&Array.isArray(x.journal))return x}catch(e){}return initial()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(x){return e(x)}
function race(){return state.races.find(r=>r.id===currentRaceId)||state.races[0]}
function score(h){let points=0,max=0;FACTORS.forEach(f=>{let v=h.factors?.[f.key];if(v==='yes'||v==='mixed'||v==='no'){max+=f.weight;points+=f.weight*(v==='yes'?1:v==='mixed'?.5:0)}});let value=max?Math.round(100*points/max):null;let coverage=Math.round(max);let rated=coverage>=75;if(!rated)return {value,coverage,rated:false,label:'Insufficient data'};return {value,coverage,rated:true,label:value>=80?'Power Candidate':value>=70?'Strong Contender':value>=60?'Watchlist':'Not qualified'}}
function prob(odds){const v=Number(odds);return Number.isFinite(v)&&v>1?(100/v).toFixed(1)+'%':null}
function changeRace(id){currentRaceId=id;render()}
function switchView(v){view=v;render()}
function render(){state=state||load();currentRaceId=currentRaceId||state.races[0]?.id;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+view));document.getElementById('app').innerHTML=view==='races'?renderRaces():view==='journal'?renderJournal():renderSettings()}
function renderRaces(){const r=race();let html=`<section class="card intro"><div><h2>Race Scanner</h2><div class="small">Live form, trainer records and indicative prices. Unvalidated models are not shown as win probabilities.</div></div>${state.races.some(x=>!String(x.id).startsWith('api_'))?'<button class="btn" onclick="openRaceForm()">+ Manual race</button>':''}</section>`;
if(!state.races.length)return html+`<section class="card empty">No races loaded yet. Add a race or import a racecard from Claude.<div style="margin-top:12px"><button class="btn primary" onclick="openImport()">Import racecard</button></div></section>`;
html+=`<div class="race-strip">${state.races.map(x=>`<button class="race-chip ${x.id===r?.id?'active':''}" onclick="changeRace('${attr(x.id)}')"><span class="time">${e(x.time||'TBC')}</span><small>${e(x.course||'Race')} · ${e(x.date?.slice(5)||'')}</small></button>`).join('')}</div>`;
if(!r)return html;let isArchived=r.date<new Date().toLocaleDateString('en-CA');const list=[...r.runners].filter(h=>!String(r.id).startsWith('api_')||!h.is_non_runner).sort((a,b)=>{const x=score(a),y=score(b);return Number(y.rated)-Number(x.rated)||(y.rated?(y.value-x.value):(y.coverage-x.coverage))||a.name.localeCompare(b.name)});
html+=`<section class="card race-head"><div class="headrow"><div><span class="tag">${e(r.date)} · ${e(r.time)} · ${e(r.course)}</span><h2>${e(r.title||'Unnamed race')}</h2><div class="small">${e(r.type||'')} · ${e(r.distance||'Distance unknown')} · Going: ${e(r.going||'Unknown')} · ${String(r.id).startsWith('api_')?r.runners.filter(h=>!h.is_non_runner).length:r.runners.length} runners</div></div><button class="btn ghost" onclick="openRaceForm('${attr(r.id)}')">Edit</button></div>${String(r.id).startsWith('api_')?'':`<div class="toolbar"><button class="btn" onclick="openImport()">Import / paste racecard</button><button class="btn" onclick="openRunnerForm()">+ Runner</button></div>`}<div class="fine">Source: ${e(r.source||'Manually entered')}</div>${isArchived?`<div class="tip alert">This racecard is from a past date. Example data are not live selections.</div>`:''}<div class="tip">Live racecard facts are automated. The historical model is still being validated; odds and recent form alone do not establish value.</div></section>`;
html+=`<div class="section-title"><h3>Runners · ${list.length}</h3><span class="tiny">Green = rating-screen research candidate · not a betting recommendation</span></div><div class="races-grid">`;
html+=list.map(h=>{const s=score(h),p=prob(h.odds),watch=String(r.id).startsWith('api_')&&typeof researchProfile==='function'?researchProfile(r,h):null;return `<article id="pifrunner-${attr(h.id)}" class="card runner" style="margin-top:8px;cursor:pointer;${watch?.priority?'border-color:#42b58f;background:#112c31;':''}" tabindex="0" role="button" onclick="openRunnerForm('${attr(h.id)}')" onkeydown="if(event.key==='Enter')openRunnerForm('${attr(h.id)}')"><div><div class="rname">${e(h.name)}${watch?.priority?' <span class="tag" style="color:#80e0bb">RATING-CHECKED</span>':''}</div><div class="rmeta">Form ${e(h.form||'—')} · OR ${e(h.or||'—')} · ${e(h.days||'—')} days</div><div class="stats">${String(r.id).startsWith('api_')&&h.recent_form?.shown?`<span class="stat">Last ${e(h.recent_form.shown)} form figures: ${e(h.recent_form.wins)} wins · ${e(h.recent_form.places)} top-3</span>`:''}<span class="stat">${e(h.trainer||'Trainer unknown')}</span>${Number(h.trainer14_runs)>0?`<span class="stat">Trainer 14d: ${e(h.trainer14_wins||'0')}/${e(h.trainer14_runs)} wins</span>`:''}${h.market_betfair?`<span class="stat">Betfair indicative: ${e(h.market_betfair)}</span>`:''}${h.market_bet365?`<span class="stat">Bet365 indicative: ${e(h.market_bet365)}</span>`:''}${h.odds?`<span class="stat">Manually noted: ${e(h.odds)} · ${p||'—'} break even</span>`:''}</div>${h.private_history?.last12mo_recorded_runs>0?`<div class="fine" style="margin-top:8px;color:#bde3d1"><strong>Recorded history (12-month backfill, partial):</strong> ${e(h.private_history.last12mo_recorded_runs)} prior runs · ${e(h.private_history.course_runs)} at course (${e(h.private_history.course_wins)} wins) · ${e(h.private_history.similar_distance_runs)} at similar trip (${e(h.private_history.similar_distance_top3)} top-three) · ${e(h.private_history.same_going_runs)} on matching going (${e(h.private_history.same_going_top3)} top-three)</div>`:''}</div><div>${String(r.id).startsWith('api_')?`<div class="rate">${watch?.priority?'Rating-screen candidate':watch?.watch?'Preliminary form signal':'Not shortlisted'}</div><div class="coverage">${watch?.rank!==null&&watch?.rank!==undefined?'Rating #'+watch.rank+'/'+watch.fieldCount+' · unvalidated':'No comparable rating · unvalidated'}</div>`:`<div class="score ${s.rated?'':'na'}">${s.rated?s.value:'—'}</div><div class="rate">${s.rated?e(s.label):'Manual score unavailable'}</div><div class="coverage">${s.coverage?`Manual coverage ${s.coverage}%`:'Manual rating not assessed'}</div>`}</div></article>`}).join('');html+='</div>';return html}
function renderJournal(){const j=state.journal;let won=j.filter(x=>x.result==='win'),lost=j.filter(x=>x.result==='loss');let settled=won.length+lost.length,profit=j.filter(x=>x.result==='win'||x.result==='loss').reduce((s,x)=>s+(x.result==='win'?(Number(x.odds)-1)*Number(x.stake):-Number(x.stake)),0);return `<section class="card"><div class="intro"><div><h2>Paper Tracker</h2><div class="small">Record hypothetical singles and their results. No real bets are placed.</div></div><button class="btn primary" onclick="openJournal()">+ Selection</button></div><div class="grid2" style="margin-top:17px"><div><div class="tiny">SETTLED</div><div class="metric">${settled}</div></div><div><div class="tiny">PAPER RETURN</div><div class="metric ${profit>=0?'status-win':'status-loss'}">${profit<0?'−':''}£${Math.abs(profit).toFixed(2)}</div></div><div><div class="tiny">WINS / LOSSES</div><div class="metric">${won.length} / ${lost.length}</div></div><div><div class="tiny">STATUS</div><div style="font-weight:700;color:var(--mint)">Paper only</div></div></div></section><div class="tip alert">Results from a few selections cannot demonstrate a profitable edge. Track all selections, including losses and passes.</div>${j.length?j.map(x=>`<article class="card"><div class="journal"><div><div class="rname">${e(x.horse)}</div><div class="small">${e(x.race)} · ${e(x.date)}</div><div class="fine">£${Number(x.stake).toFixed(2)} paper stake · ${e(x.odds)} decimal odds</div></div><div class="right"><span class="tag ${x.result==='win'?'status-win':x.result==='loss'?'status-loss':''}">${e(x.result)}</span><div style="margin-top:9px"><button class="btn" onclick="openJournal('${attr(x.id)}')">Update</button></div></div></div></article>`).join(''):'<section class="card empty">No paper selections recorded. Tap + Selection to start.</section>'}`}
function renderSettings(){return `<section class="card"><h2>Data & Setup</h2><div class="small">The scanner keeps your races and notes in this browser only. It does not send them to a server.</div><div class="toolbar"><button class="btn primary" onclick="openImport()">Import racecard</button><button class="btn" onclick="downloadBackup()">Export backup</button><button class="btn" onclick="document.getElementById('backup-file').click()">Restore backup</button></div><input hidden type="file" id="backup-file" accept=".json,application/json" onchange="restoreBackup(this)"><div class="divider"></div><h3 style="margin-bottom:5px">Paste from Claude</h3><div class="small">Ask Claude to list a complete racecard in a markdown table with horse name, age, official rating (OR), weight, form, days since run, trainer and jockey. Copy the table and paste it with the Import button. Multiple race tables can be imported if headings include course and time.</div><div class="divider"></div><h3 style="margin-bottom:5px">Current limitations</h3><div class="small">No automatic live race retrieval; no bookmaker or Exchange odds feed; no scientific win-probability model; no verified predictive profitability. Ratings must be awarded from actual evidence. Never put Racing API credentials into this web app.</div><div class="divider"></div><button class="btn danger" onclick="clearData()">Erase local data</button></section><section class="card"><h3 style="margin-top:0">Formula V1.0</h3>${FACTORS.map(f=>`<div class="fieldrow"><div>${e(f.label)}<div class="desc">${e(f.detail)}</div></div><strong>${f.weight} pts</strong></div>`).join('')}<div class="small" style="margin-top:13px">A factor can be positive (full points), mixed (half), negative (zero), or unknown (excluded). Normalised score = earned points / assessed points × 100. Only show a category when at least 75 points of evidence were assessed.</div></section>`}
function modal(html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function openRunnerForm(id){const r=race();if(!r)return;let h=r.runners.find(x=>x.id===id)||{id:'',name:'',age:'',or:'',weight:'',days:'',form:'',trainer:'',jockey:'',odds:'',notes:'',factors:{}};const sc=score(h);modal(`<div class="headrow"><h2>${id?'Assess runner':'Add runner'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="runner-form" onsubmit="saveRunner(event,'${attr(id||'')}')"><div class="grid2"><div class="field"><label>Horse name</label><input name="name" required value="${attr(h.name)}"></div><div class="field"><label>Decimal odds (optional)</label><input name="odds" inputmode="decimal" value="${attr(h.odds||'')}" placeholder="e.g. 5.50"></div><div class="field"><label>Recent form</label><input name="form" value="${attr(h.form||'')}"></div><div class="field"><label>Official rating</label><input name="or" inputmode="numeric" value="${attr(h.or||'')}"></div><div class="field"><label>Days since run</label><input name="days" inputmode="numeric" value="${attr(h.days||'')}"></div><div class="field"><label>Weight (lbs)</label><input name="weight" inputmode="numeric" value="${attr(h.weight||'')}"></div><div class="field"><label>Trainer</label><input name="trainer" value="${attr(h.trainer||'')}"></div><div class="field"><label>Jockey</label><input name="jockey" value="${attr(h.jockey||'')}"></div></div><div class="divider"></div><div class="headrow"><strong>Power Check</strong><span class="pill">Coverage ${sc.coverage}%</span></div><div class="small" style="margin:6px 0 12px">Use 'Unknown' unless you have checked past race evidence. A recent win alone does not verify going or distance suitability.</div>${FACTORS.map(f=>`<div class="fieldrow"><div><strong style="font-size:13px">${e(f.label)}</strong> <span class="tiny">(${f.weight})</span><div class="desc">${e(f.detail)}</div></div><select name="factor_${f.key}"><option value="">Unknown</option>${[['yes','Positive'],['mixed','Mixed'],['no','Negative']].map(v=>`<option value="${v[0]}" ${h.factors?.[f.key]===v[0]?'selected':''}>${v[1]}</option>`).join('')}</select></div>`).join('')}<div class="field"><label>Evidence / concerns / sources</label><textarea name="notes" rows="3" placeholder="e.g. Won at this course, on similar going, race date and source">${e(h.notes||'')}</textarea></div><div class="actions"><button class="btn primary" type="submit">Save assessment</button>${id?`<button type="button" class="btn" onclick="trackHorse('${attr(id)}')">Paper-track</button><button type="button" class="btn danger" onclick="deleteRunner('${attr(id)}')">Delete</button>`:''}</div></form>`)}
function saveRunner(evt,id){evt.preventDefault();const r=race(),d=new FormData(evt.target);if(!r)return;const odds=d.get('odds').trim();if(odds&&(Number(odds)<=1||!Number.isFinite(Number(odds))))return alert('Decimal odds must be greater than 1.00.');let h=r.runners.find(x=>x.id===id);if(!h){h={id:newId(),factors:{}};r.runners.push(h)};for(const k of ['name','odds','form','or','days','weight','trainer','jockey','notes'])h[k]=String(d.get(k)||'').trim();h.factors={};FACTORS.forEach(f=>{const s=d.get('factor_'+f.key);if(s)h.factors[f.key]=s});save();closeModal();render()}
function deleteRunner(id){if(!confirm('Remove this runner?'))return;const r=race();r.runners=r.runners.filter(x=>x.id!==id);save();closeModal();render()}
function openRaceForm(id){const r=state.races.find(x=>x.id===id)||{date:new Date().toLocaleDateString('en-CA'),course:'',time:'',title:'',type:'Hurdle',going:'',distance:'',source:'Manually entered'};modal(`<div class="headrow"><h2>${id?'Edit race':'Add a race'}</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveRace(event,'${attr(id||'')}')"><div class="grid2"><div class="field"><label>Course</label><input name="course" required value="${attr(r.course)}" placeholder="e.g. Hereford"></div><div class="field"><label>UK local time</label><input name="time" type="time" required value="${attr(r.time||'14:20')}"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${attr(r.date)}"></div><div class="field"><label>Race type</label><select name="type">${['Hurdle','Chase','Flat','All-weather','Bumper','Other'].map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Distance</label><input name="distance" value="${attr(r.distance)}" placeholder="e.g. 2m 4f"></div><div class="field"><label>Going</label><input name="going" value="${attr(r.going)}" placeholder="e.g. Good"></div></div><div class="field"><label>Race description / class</label><input name="title" required value="${attr(r.title)}" placeholder="Class 4 Handicap Hurdle"></div><div class="actions"><button type="submit" class="btn primary">Save race</button>${id?`<button type="button" class="btn danger" onclick="deleteRace('${attr(id)}')">Delete race</button>`:''}</div></form>`)}
function saveRace(evt,id){evt.preventDefault();let d=new FormData(evt.target),r=state.races.find(x=>x.id===id);if(!r){r={id:newId(),runners:[],source:'Manually entered'};state.races.unshift(r)}for(const k of ['course','date','time','title','type','going','distance'])r[k]=String(d.get(k)||'').trim();currentRaceId=r.id;save();closeModal();switchView('races')}
function deleteRace(id){if(!confirm('Delete this race and all its assessments?'))return;state.races=state.races.filter(x=>x.id!==id);currentRaceId=state.races[0]?.id;save();closeModal();render()}
function trackHorse(id){const h=race()?.runners.find(x=>x.id===id);if(!h)return;closeModal();openJournal('',h)}
function openJournal(id,h){const old=state.journal.find(x=>x.id===id)||{horse:h?.name||'',race:race()?`${race().course} ${race().time}`:'',date:race()?.date||new Date().toLocaleDateString('en-CA'),odds:h?.odds||'',stake:'1',result:'pending'};modal(`<div class="headrow"><h2>${id?'Update':'Log'} paper selection</h2><button class="close" onclick="closeModal()">✕</button></div><div class="tip alert">This is hypothetical tracking only. It does not place a wager.</div><form onsubmit="saveJournal(event,'${attr(id||'')}')"><div class="field"><label>Horse</label><input name="horse" required value="${attr(old.horse)}"></div><div class="field"><label>Race</label><input name="race" required value="${attr(old.race)}"></div><div class="grid2"><div class="field"><label>Date</label><input name="date" type="date" required value="${attr(old.date)}"></div><div class="field"><label>Decimal odds</label><input name="odds" inputmode="decimal" required value="${attr(old.odds)}" placeholder="e.g. 4.50"></div><div class="field"><label>Paper stake (£)</label><input name="stake" inputmode="decimal" value="${attr(old.stake)}" required></div><div class="field"><label>Outcome</label><select name="result">${[['pending','Not settled'],['win','Win'],['loss','Loss'],['void','Void / non-runner']].map(v=>`<option value="${v[0]}" ${old.result===v[0]?'selected':''}>${v[1]}</option>`).join('')}</select></div></div><div class="actions"><button type="submit" class="btn primary">Save paper entry</button>${id?`<button type="button" class="btn danger" onclick="deleteJournal('${attr(id)}')">Delete</button>`:''}</div></form>`)}
function saveJournal(evt,id){evt.preventDefault();const d=new FormData(evt.target);const odds=Number(d.get('odds')),stake=Number(d.get('stake'));if(!(odds>1&&stake>0))return alert('Enter decimal odds above 1 and a positive hypothetical stake.');let x=state.journal.find(x=>x.id===id);if(!x){x={id:newId()};state.journal.unshift(x)}for(const k of ['horse','race','date','odds','stake','result'])x[k]=String(d.get(k)||'').trim();save();closeModal();switchView('journal')}
function deleteJournal(id){if(!confirm('Delete this paper selection?'))return;state.journal=state.journal.filter(x=>x.id!==id);save();closeModal();render()}
function openImport(){modal(`<div class="headrow"><h2>Import racecard</h2><button class="close" onclick="closeModal()">✕</button></div><div class="small">Paste one or more race tables copied from Claude, or enter one runner per line using: Horse | OR | Form | Days | Odds. Each recognised race table becomes a new racecard. Check the race date and course before scoring.</div><div class="field"><label>Paste text</label><textarea id="race-paste" rows="10" placeholder="| # | Horse (age) | OR | lbs | Form | Days since run | Hg | Trainer | Jockey |\n| 1 | Example Horse (7) | 107 | 160 | 2-1-3 | 21 | – | Trainer | Jockey |"></textarea></div><div class="actions"><button class="btn primary" onclick="importPaste()">Parse runners</button></div><div class="small" style="margin-top:9px">Imports are labelled as pasted data, not independently verified. No external services are contacted.</div>`)}
function parseTable(text){const lines=text.split(/\r?\n/),result=[];let header='';let tableMode=false;for(const line of lines){if(/^\s{0,3}#{1,5}\s+/.test(line)){header=line.replace(/^\s*#+\s*/,'').trim();tableMode=false;continue}if(/^\s*\|/.test(line)){const cols=line.split('|').slice(1,-1).map(x=>x.trim());if(cols.some(x=>/horse.*age/i.test(x))){tableMode=true;continue}if(cols.every(x=>/^:?-+:?$/.test(x)))continue;if(tableMode&&cols.length>=8&&/^\d+$/.test(cols[0])){const m=cols[1].match(/^(.*?)\s*\((\d+)\)$/);if(!m)continue;result.push({name:m[1].trim(),age:Number(m[2]),or:cols[2]||'',weight:cols[3]||'',form:cols[4]||'',days:(cols[5]||'').match(/\d+/)?.[0]||'',trainer:cols[7]||'',jockey:cols[8]||'',factors:{},notes:'',odds:''})}}}if(!result.length){for(const line of lines){if(!line.trim()||/^horse/i.test(line.trim()))continue;const c=line.split('|').map(s=>s.trim());if(c.length>=2&&c[0]&&!c[0].startsWith('#'))result.push({name:c[0],or:c[1]||'',form:c[2]||'',days:c[3]||'',odds:c[4]||'',factors:{},notes:''})}}return {runners:result,heading:header}}
function importPaste(){
 const text=document.getElementById('race-paste').value.trim();if(!text)return alert('Paste the racecard text first.');
 // Treat different markdown headings as different races. Never merge unrelated runners.
 const sections=text.split(/(?=^\s{0,3}#{1,5}\s+)/m).filter(x=>x.trim());
 let groups=sections.map(x=>({raw:x,...parseTable(x)})).filter(g=>g.runners.length);
 if(!groups.length){const p=parseTable(text);if(p.runners.length)groups=[{raw:text,...p}]}
 if(!groups.length)return alert('No runners recognised. Paste the Claude table with its Horse (age) heading or lines using: Horse | OR | Form | Days | Odds.');
 const count=groups.reduce((sum,g)=>sum+g.runners.length,0);
 if(!confirm(`Import ${count} runners across ${groups.length} racecard(s) as new races? Check their date and course afterwards.`))return;
 let latest=null;const existingNames=state.races.map(r=>`${r.date}|${r.course}|${r.time}`);
 for(const group of groups){
  const header=group.heading||group.raw.split('\n')[0]||'';
  const tm=header.match(/\b(\d{1,2}):(\d{2})\b/);
  const time=tm?tm[1].padStart(2,'0')+':'+tm[2]:'';
  const courseMatch=text.match(/\b(?:at|for)\s+([A-Za-z][A-Za-z\s'-]{2,30}?)(?=\s+(?:today|on|races|handicap|race)|[,.\n])/i);
  const course=courseMatch?courseMatch[1].trim():'';
  const title=header.replace(/^.*?\b\d{1,2}:\d{2}\s*[,–—-]?\s*/,'').trim()||'Imported racecard';
  const race={id:newId(),date:new Date().toLocaleDateString('en-CA'),course,time,title,type:/hurdle/i.test(title)?'Hurdle':/chase/i.test(title)?'Chase':/flat/i.test(title)?'Flat':'Other',distance:'',going:'',source:'Pasted racecard — not independently verified',runners:group.runners.map(h=>({...h,id:newId()}))};
  state.races.unshift(race);latest=race;
 }
 if(latest)currentRaceId=latest.id;
 save();closeModal();switchView('races');alert(`${count} runners imported. Open Edit to confirm each race's course, date, distance, going and start time.`)
}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pif-racing-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreBackup(inp){const f=inp.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.races)||!Array.isArray(d.journal))throw Error('Unrecognised format');if(!confirm('Replace the scanner data on this device with the backup file?'))return;state=d;currentRaceId=d.races[0]?.id;save();render()}catch(err){alert('Could not read a valid PIF Racing backup: '+err.message)}}
function clearData(){if(!confirm('Erase all saved races, assessments and paper results on this device? You may want to export a backup first.'))return;state={version:1,races:[],journal:[]};currentRaceId=null;save();render()}
state=load();currentRaceId=state.races[0]?.id;render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
// Expose pure data functions for automated tests.
if(typeof module!=='undefined'&&module.exports)module.exports={FACTORS,score,prob,parseTable};
